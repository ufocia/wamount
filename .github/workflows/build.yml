name: Build WAMount

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows (GCC / MinGW-w64)
    runs-on: windows-latest

    strategy:
      matrix:
        config: [Release, Debug]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2 (MinGW-w64 GCC)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja

    - name: Install WinFsp
      shell: pwsh
      run: |
        Write-Host "Downloading WinFsp..."
        $winfspUrl = "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
        $winfspInstaller = "$env:TEMP\winfsp.msi"
        Invoke-WebRequest -Uri $winfspUrl -OutFile $winfspInstaller

        Write-Host "Installing WinFsp with SDK components..."
        # Install with ADDLOCAL=ALL to ensure SDK (headers/libs) are installed
        Start-Process msiexec.exe -ArgumentList "/i", $winfspInstaller, "/qn", "/norestart", "ADDLOCAL=ALL" -Wait

        Write-Host "Waiting for installation to complete..."
        Start-Sleep -Seconds 5

        Write-Host "Verifying WinFsp installation..."

        # Check possible installation paths
        $possiblePaths = @(
          "C:\Program Files (x86)\WinFsp",
          "C:\Program Files\WinFsp"
        )

        $winfspPath = $null
        foreach ($path in $possiblePaths) {
          if (Test-Path $path) {
            $winfspPath = $path
            Write-Host "✅ Found WinFsp at: $path"
            break
          }
        }

        if (-not $winfspPath) {
          Write-Host "❌ WinFsp installation not found!"
          Write-Host "Checked paths:"
          foreach ($path in $possiblePaths) {
            Write-Host "  - $path"
          }
          exit 1
        }

        # List what's actually installed
        Write-Host "`nInstalled WinFsp directory contents:"
        Get-ChildItem $winfspPath | Format-Table Name, Mode

        # Verify required directories exist
        $requiredDirs = @("inc", "lib", "bin")
        $allDirsFound = $true
        foreach ($dir in $requiredDirs) {
          $dirPath = Join-Path $winfspPath $dir
          if (-not (Test-Path $dirPath)) {
            Write-Host "❌ Missing required directory: $dirPath"
            $allDirsFound = $false
          } else {
            Write-Host "✅ Found: $dirPath"
            # Show contents of important directories
            if ($dir -eq "inc") {
              Write-Host "   Headers in inc/:"
              Get-ChildItem $dirPath -Recurse -File | Select-Object -First 5 | ForEach-Object { Write-Host "     - $($_.Name)" }
            }
          }
        }

        if (-not $allDirsFound) {
          Write-Host "`n❌ Not all required directories found. Installation may be incomplete."
          Write-Host "Attempting to continue anyway..."
        }

        # Save path for next step
        echo "WINFSP_PATH=$winfspPath" >> $env:GITHUB_ENV
        Write-Host "`n✅ WinFsp installed successfully at: $winfspPath"

    - name: Configure CMake (GCC)
      shell: msys2 {0}
      run: |
        # Convert the Windows path to C:/Program Files (x86)/WinFsp form for CMake
        WINFSP_DIR="$(cygpath -m "$WINFSP_PATH")"
        echo "Configuring with WinFsp path: $WINFSP_DIR"
        gcc --version
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
          -DWINFSP_PATH="$WINFSP_DIR"

    - name: Build
      shell: msys2 {0}
      run: |
        cmake --build build --verbose

    - name: List build output
      shell: pwsh
      run: |
        Write-Host "Build output files:"
        Get-ChildItem -Path build -Recurse -Include *.exe,*.dll,*.a

    - name: Upload artifacts (Release only)
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: wamount-windows-x64
        path: |
          build/wamount.exe
          README.md
          QUICKSTART.md
          LICENSE
        retention-days: 30

    - name: Upload debug artifacts
      if: matrix.config == 'Debug'
      uses: actions/upload-artifact@v4
      with:
        name: wamount-windows-x64-debug
        path: |
          build/wamount.exe
        retention-days: 7

  build-info:
    name: Build Information
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Display build info
      run: |
        echo "✅ WAMount build completed successfully!"
        echo ""
        echo "📦 Artifacts available:"
        echo "   - wamount-windows-x64 (Release build)"
        echo "   - wamount-windows-x64-debug (Debug build)"
        echo ""
        echo "📥 Download artifacts from the Actions tab"
        echo "🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
